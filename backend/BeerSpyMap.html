<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BeerSpy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>

</style>
</head>
<body>
<div id="app">

<header>
<h1>BeerSpy — Brisbane</h1>
<span class="tag">cheapest pints, spied on your behalf</span>
</header>

<div id="findMeBar">
<button class="beerBtn" id="useMyLocationBtn">Find Near Me</button>
<input id="manualAddyInput" type="text" placeholder="or type a suburb/address..." />
<button class="beerBtn secondary" id="searchAddyBtn">Search</button>
<button class="beerBtn purple" id="crawlModeBtn">Plan a Crawl</button>
<button class="beerBtn secondary" id="submitModeBtn">➕ Submit a Pub</button>
<div id="locStatus"></div>
</div>

<div id="submitPanel">
<div class="row">
<div class="searchWrap">
<input class="wide" id="subPubSearch" type="text" placeholder="Start typing a pub name (e.g. Story Bridge Hotel)..." autocomplete="off" />
<div id="pubSearchDropdown"></div>
</div>
</div>
<div class="row">
<input class="narrow" id="subPrice" type="number" step="0.10" placeholder="Price ($)" />
<input class="narrow" id="subBeer" type="text" placeholder="Beer/brand" style="width:160px" />
</div>
<div id="submitPreview">
Selected: <span class="pt" id="previewCoords"></span>
<div style="margin-top:6px">
<button class="beerBtn" id="confirmAddPubBtn">Add This Pin</button>
<button class="beerBtn secondary" id="cancelAddPubBtn">Cancel</button>
</div>
</div>
<div id="submitStatus"></div>
</div>

<div id="crawlPanel">
<div class="hdr">
<strong>Pick 3–4 pubs for your crawl</strong>
<div>
<button class="beerBtn purple" id="optimizeCrawlBtn" disabled>Optimize Route</button>
<button class="beerBtn secondary" id="clearCrawlBtn">Clear</button>
</div>
</div>
<div id="crawlPicks"></div>
<div id="crawlResult"></div>
</div>

<div id="statsBarThingy"></div>

<div id="routeLegend">
<div class="item"><span class="swatch" style="background:#4fb1e0"></span> Route to nearest pub (1)</div>
<div class="item"><span class="swatch" style="background:#4fae63"></span> Route to nearest cheap pub</div>
</div>

<div id="map-wrap">
<div id="map"></div>
<div class="legend">
<div><span class="dot" style="background:#4fae63"></span> Under $8</div>
<div><span class="dot" style="background:#dd9f34"></span> $8 – $10</div>
<div><span class="dot" style="background:#d1543a"></span> Over $10</div>
</div>
</div>

</div>

<script>
var pubs = [
{name:"The Beat Megaclub",lat:-27.4678,lng:153.0281,price:7.50,beer:"Great Northern",suburb:"Fortitude Valley"},
{name:"The Regatta",lat:-27.4936,lng:153.0107,price:9.00,beer:"XXXX Gold",suburb:"Toowong"},
{name:"The Caxton",lat:-27.4626,lng:153.0089,price:11.50,beer:"Peroni",suburb:"Petrie Terrace"},
{name:"Story Bridge Hotel",lat:-27.4667,lng:153.0369,price:8.90,beer:"Furphy",suburb:"Kangaroo Point"},
{name:"The Fox Hotel",lat:-27.4735,lng:153.0355,price:6.90,beer:"Carlton Draught",suburb:"Woolloongabba"},
{name:"The Norman Hotel",lat:-27.4839,lng:153.0326,price:10.20,beer:"Stone & Wood",suburb:"South Brisbane"},
{name:"Pig 'N' Whistle",lat:-27.4699,lng:153.0258,price:12.00,beer:"James Squire",suburb:"CBD"},
{name:"The Milton",lat:-27.4712,lng:153.0060,price:7.20,beer:"XXXX Bitter",suburb:"Milton"}
];

function getPinColor(p){
  if(p<8) return '#4fae63';
  if(p<=10) return '#dd9f34';
  return '#d1543a';
}

function kmBetween(lat1,lng1,lat2,lng2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function refreshStats(extra){
  var prices=pubs.map(function(p){return p.price});
  var sum=0;
  for(var i=0;i<prices.length;i++) sum+=prices[i];
  var avg=(sum/prices.length).toFixed(2);
  var lo=Math.min.apply(null,prices).toFixed(2);
  var hi=Math.max.apply(null,prices).toFixed(2);
  var range=(hi-lo).toFixed(2);

  var blocks=[
    {num:'$'+avg,label:'Brisbane Average'},
    {num:'$'+lo,label:'Cheapest Found'},
    {num:pubs.length,label:'Venues Tracked'},
    {num:'$'+range,label:'Price Range'}
  ];
  if(extra) blocks=extra.concat(blocks);

  var html='';
  for(var j=0;j<blocks.length;j++){
    html+='<div class="stat"><div class="num">'+blocks[j].num+'</div><div class="label">'+blocks[j].label+'</div></div>';
  }
  document.getElementById('statsBarThingy').innerHTML=html;
}
refreshStats();

var latTotal=0,lngTotal=0;
pubs.forEach(function(p){latTotal+=p.lat;lngTotal+=p.lng});
var center=[latTotal/pubs.length,lngTotal/pubs.length];

var map=L.map('map',{zoomControl:true}).setView(center,13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom:20,subdomains:'abcd'
}).addTo(map);

var pubMarkers=[],meMarker=null,routeLines=[],routeLabels=[],myLoc=null,crawlOn=false,crawlPicked=[];

function drawPins(heroes){
  pubMarkers.forEach(function(m){map.removeLayer(m)});
  pubMarkers=[];
  var bounds=[];
  heroes=heroes||{};

  pubs.forEach(function(pub){
    var col=getPinColor(pub.price);
    var isNear=heroes.nearest===pub;
    var isCheap=heroes.cheapest===pub;
    var crawlIdx=crawlPicked.indexOf(pub);
    var picked=crawlIdx!==-1;
    var hero=isNear||isCheap;

    var badge='';
    if(picked) badge='<div class="badge crawlnum">'+(crawlIdx+1)+'</div>';
    else if(isNear) badge='<div class="badge">1</div>';
    else if(isCheap) badge='<div class="badge">$</div>';

    var icon=L.divIcon({
      className:'',
      html:'<div style="position:relative"><div class="pin '+(hero?'hero ':'')+(picked?'crawlpick':'')+'" style="background:'+col+';--glow-color:'+col+'66"><span class="pin-price">$'+Math.round(pub.price)+'</span></div>'+badge+'</div>',
      iconSize:hero?[48,48]:[40,40],
      iconAnchor:hero?[24,48]:[20,40],
      popupAnchor:[0,-40]
    });

    var distTxt=pub._dist!=null ? pub._dist.toFixed(1)+' km away' : '';
    var mk=L.marker([pub.lat,pub.lng],{icon:icon}).addTo(map);
    mk.bindPopup('<div class="popup-title">'+pub.name+'</div><div class="popup-price">$'+pub.price.toFixed(2)+'</div><div class="popup-meta">'+pub.beer+' · '+pub.suburb+(distTxt?' · '+distTxt:'')+'</div>');
    mk.on('click',function(){ if(crawlOn) toggleCrawl(pub) });
    pubMarkers.push(mk);
    bounds.push([pub.lat,pub.lng]);
  });
  return bounds;
}

var initBounds=drawPins();
if(initBounds.length) map.fitBounds(initBounds,{padding:[40,40]});

function dropMe(lat,lng){
  if(meMarker) map.removeLayer(meMarker);
  meMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="meMarker"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
}

function clearRoutes(){
  routeLines.forEach(function(l){map.removeLayer(l)});
  routeLines=[];
  routeLabels.forEach(function(l){map.removeLayer(l)});
  routeLabels=[];
}

function fetchRoute(fromLat,fromLng,toLat,toLng){
  var url='https://router.project-osrm.org/route/v1/foot/'+fromLng+','+fromLat+';'+toLng+','+toLat+'?overview=full&geometries=geojson';
  return fetch(url).then(function(res){return res.json()}).then(function(data){
    if(!data.routes || !data.routes.length) throw 'no route';
    var coords=data.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]]});
    return {coords:coords, km:data.routes[0].distance/1000};
  });
}

function drawRoute(fromLat,fromLng,toPub,color,offset){
  return fetchRoute(fromLat,fromLng,toPub.lat,toPub.lng).catch(function(){
    return {coords:[[fromLat,fromLng],[toPub.lat,toPub.lng]], km:kmBetween(fromLat,fromLng,toPub.lat,toPub.lng)};
  }).then(function(r){
    var line=L.polyline(r.coords,{color:color,weight:4,opacity:.85,dashArray:'1, 8',lineCap:'round'}).addTo(map);
    routeLines.push(line);
    var mid=r.coords[Math.floor(r.coords.length/2)] || r.coords[0];
    var lbl=L.marker(mid,{icon:L.divIcon({className:'',html:'<div class="routeLabel" style="border-color:'+color+'">'+r.km.toFixed(1)+' km</div>',iconSize:[60,20],iconAnchor:[30,offset?30:0]}),interactive:false}).addTo(map);
    routeLabels.push(lbl);
    return r.km;
  });
}

function goToLocation(lat,lng,label){
  myLoc=[lat,lng];
  dropMe(lat,lng);
  clearRoutes();

  pubs.forEach(function(p){ p._dist=kmBetween(lat,lng,p.lat,p.lng) });
  pubs.sort(function(a,b){ return a._dist-b._dist });

  var nearest=pubs[0];
  var cheapOnes=pubs.filter(function(p){return p.price<8});
  var nearestCheap=cheapOnes.length ? cheapOnes.reduce(function(best,p){return p._dist<best._dist?p:best}) : null;

  drawPins({nearest:nearest,cheapest:nearestCheap});
  renderCrawlChips();

  document.getElementById('locStatus').textContent=(label||'')+' — drawing routes...';
  document.getElementById('routeLegend').classList.add('show');

  drawRoute(lat,lng,nearest,'#4fb1e0',false).then(function(nearKm){
    var extras=[{num:nearKm.toFixed(1)+'km',label:'Nearest — '+nearest.name}];

    var chain=Promise.resolve();
    if(nearestCheap && nearestCheap!==nearest){
      chain=drawRoute(lat,lng,nearestCheap,'#4fae63',true).then(function(cheapKm){
        extras.push({num:cheapKm.toFixed(1)+'km',label:'Cheapest nearby — '+nearestCheap.name});
      });
    } else if(nearestCheap===nearest){
      extras.push({num:'same pub!',label:'Nearest is also cheapest'});
    } else {
      extras.push({num:'n/a',label:'No sub-$8 pub found'});
    }

    chain.then(function(){
      refreshStats(extras);
      var b=[[lat,lng],[nearest.lat,nearest.lng]];
      if(nearestCheap) b.push([nearestCheap.lat,nearestCheap.lng]);
      map.fitBounds(b,{padding:[60,60]});
      document.getElementById('locStatus').textContent=label||'';
    });
  });
}

document.getElementById('useMyLocationBtn').onclick=function(){
  var s=document.getElementById('locStatus');
  if(!navigator.geolocation){ s.textContent="your browser won't do location, try typing an address instead"; return }
  s.textContent="finding you...";
  navigator.geolocation.getCurrentPosition(
    function(pos){ goToLocation(pos.coords.latitude,pos.coords.longitude,"using your current location") },
    function(){ s.textContent="couldn't get your location — permission blocked? try typing an address" },
    {enableHighAccuracy:true,timeout:8000}
  );
};

document.getElementById('searchAddyBtn').onclick=doAddySearch;
document.getElementById('manualAddyInput').addEventListener('keydown',function(e){ if(e.key==='Enter') doAddySearch() });

function doAddySearch(){
  var q=document.getElementById('manualAddyInput').value.trim();
  var s=document.getElementById('locStatus');
  if(!q) return;
  s.textContent="looking that up...";
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q+', Brisbane, Australia'))
    .then(function(r){return r.json()})
    .then(function(data){
      if(!data.length){ s.textContent="couldn't find that place, try being more specific"; return }
      goToLocation(parseFloat(data[0].lat),parseFloat(data[0].lon),'showing pubs near "'+q+'"');
    })
    .catch(function(){ s.textContent="search broke, try again" });
}

var crawlPanel=document.getElementById('crawlPanel');
var crawlBtn=document.getElementById('crawlModeBtn');
var optimizeBtn=document.getElementById('optimizeCrawlBtn');

crawlBtn.onclick=function(){
  crawlOn=!crawlOn;
  crawlBtn.textContent=crawlOn ? '✅ Picking pubs...' : '🍻 Plan a Crawl';
  crawlPanel.classList.toggle('show',crawlOn);
  if(crawlOn) renderCrawlChips();
};

document.getElementById('clearCrawlBtn').onclick=function(){
  crawlPicked=[];
  clearCrawlRoute();
  document.getElementById('crawlResult').innerHTML='';
  renderCrawlChips();
  drawPins();
};

function toggleCrawl(pub){
  var idx=crawlPicked.indexOf(pub);
  if(idx!==-1){
    crawlPicked.splice(idx,1);
  } else {
    if(crawlPicked.length>=4){
      document.getElementById('crawlResult').innerHTML='<span style="color:#d1543a">max 4 pubs per crawl — deselect one first</span>';
      return;
    }
    crawlPicked.push(pub);
  }
  renderCrawlChips();
  drawPins();
}

function renderCrawlChips(){
  var el=document.getElementById('crawlPicks');
  var html='';
  pubs.forEach(function(p){
    var idx=crawlPicked.indexOf(p);
    var picked=idx!==-1;
    html+='<div class="crawlChip '+(picked?'picked':'')+'" data-name="'+p.name+'">'+(picked?'<span class="num">'+(idx+1)+'.</span> ':'')+p.name+' <span style="opacity:.6">$'+p.price.toFixed(2)+'</span></div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.crawlChip').forEach(function(chip){
    chip.onclick=function(){
      var pub=pubs.find(function(p){return p.name===chip.dataset.name});
      toggleCrawl(pub);
    };
  });
  optimizeBtn.disabled=crawlPicked.length<3;
}

var crawlRouteLines=[],crawlRouteLabels=[];

function clearCrawlRoute(){
  crawlRouteLines.forEach(function(l){map.removeLayer(l)});
  crawlRouteLines=[];
  crawlRouteLabels.forEach(function(l){map.removeLayer(l)});
  crawlRouteLabels=[];
}

optimizeBtn.onclick=function(){
  if(crawlPicked.length<3) return;
  var resultEl=document.getElementById('crawlResult');
  resultEl.textContent='optimizing your crawl route...';
  clearCrawlRoute();

  var coordsList=[];
  var originIsMe=!!myLoc;
  if(originIsMe) coordsList.push(myLoc[1]+','+myLoc[0]);
  crawlPicked.forEach(function(p){ coordsList.push(p.lng+','+p.lat) });

  var url='https://router.project-osrm.org/trip/v1/foot/'+coordsList.join(';')+'?source=first&roundtrip=false&overview=full&geometries=geojson';

  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(!data.trips || !data.trips.length) throw 'no trip';

    var trip=data.trips[0];
    var coords=trip.geometry.coordinates.map(function(c){return [c[1],c[0]]});
    var totalKm=trip.distance/1000;
    var totalMin=Math.round(trip.duration/60);

    var line=L.polyline(coords,{color:'#a56fd1',weight:5,opacity:.9,dashArray:'2, 10',lineCap:'round'}).addTo(map);
    crawlRouteLines.push(line);

    var order=data.waypoints.map(function(wp,i){return {i:i,order:wp.waypoint_index}}).sort(function(a,b){return a.order-b.order}).map(function(w){return w.i});
    var stops=order.filter(function(i){ return !(originIsMe && i===0) }).map(function(i){ return originIsMe ? crawlPicked[i-1] : crawlPicked[i] });

    stops.forEach(function(pub,idx){
      var numIcon=L.divIcon({
        className:'',
        html:'<div style="background:#a56fd1;color:#1a1208;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:Arial;border:2px solid #160f0a;box-shadow:0 2px 6px rgba(0,0,0,.6)">'+(idx+1)+'</div>',
        iconSize:[26,26],iconAnchor:[13,13]
      });
      crawlRouteLabels.push(L.marker([pub.lat,pub.lng],{icon:numIcon,interactive:false}).addTo(map));
    });

    var totalCost=stops.reduce(function(s,p){return s+p.price},0).toFixed(2);
    var list='';
    stops.forEach(function(p){ list+='<li>'+p.name+' — $'+p.price.toFixed(2)+' ('+p.suburb+')</li>' });

    resultEl.innerHTML='<strong>'+totalKm.toFixed(1)+' km · ~'+totalMin+' min walking · $'+totalCost+' for one round</strong><ol>'+list+'</ol>';

    var fitB=coords.length?coords:stops.map(function(p){return [p.lat,p.lng]});
    map.fitBounds(fitB,{padding:[50,50]});
  }).catch(function(){
    resultEl.innerHTML='<span style="color:#d1543a">couldn\'t reach the routing service — try again in a sec</span>';
  });
};

var submitPanel=document.getElementById('submitPanel');
var submitBtn=document.getElementById('submitModeBtn');
var pendingPub=null;

submitBtn.onclick=function(){
  var showing=submitPanel.classList.toggle('show');
  submitBtn.textContent=showing?'➕ Cancel':'➕ Submit a Pub';
  if(!showing) resetSubmitForm();
};

function resetSubmitForm(){
  pendingPub=null;
  document.getElementById('submitPreview').classList.remove('show');
  document.getElementById('submitStatus').textContent='';
}

var subSearch=document.getElementById('subPubSearch');
var dropdown=document.getElementById('pubSearchDropdown');
var searchTimer=null;

subSearch.addEventListener('input',function(){
  clearTimeout(searchTimer);
  var q=subSearch.value.trim();
  document.getElementById('submitPreview').classList.remove('show');
  pendingPub=null;

  if(q.length<3){ dropdown.classList.remove('show'); return }

  dropdown.innerHTML='<div id="pubSearchLoading">searching...</div>';
  dropdown.classList.add('show');
  searchTimer=setTimeout(function(){ runSearch(q) },400);
});

function runSearch(q){
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q='+encodeURIComponent(q+', Brisbane, Queensland, Australia'))
    .then(function(r){return r.json()})
    .then(function(data){
      if(!data.length){ dropdown.innerHTML='<div id="pubSearchLoading">no matches — try a different spelling or add a suburb</div>'; return }

      var html='';
      data.forEach(function(r,i){
        var shortName=r.display_name.split(',')[0];
        var rest=r.display_name.split(',').slice(1,4).join(',').trim();
        html+='<div class="pubOption" data-idx="'+i+'"><span class="oName">'+shortName+'</span><span class="oAddr">'+rest+'</span></div>';
      });
      dropdown.innerHTML=html;

      dropdown.querySelectorAll('.pubOption').forEach(function(opt){
        opt.onclick=function(){
          var r=data[parseInt(opt.dataset.idx)];
          pickPub(r);
        };
      });
    })
    .catch(function(){ dropdown.innerHTML='<div id="pubSearchLoading">search failed, try again</div>' });
}

function pickPub(r){
  var lat=parseFloat(r.lat);
  var lng=parseFloat(r.lon);
  var parts=r.display_name.split(',');
  var name=parts[0].trim();
  var suburb=(r.address && (r.address.suburb || r.address.city_district)) || (parts[1]?parts[1].trim():'Brisbane');

  pendingPub={name:name,lat:lat,lng:lng,price:null,beer:null,suburb:suburb};

  document.getElementById('previewCoords').textContent=name+' — '+lat.toFixed(4)+', '+lng.toFixed(4)+' ('+suburb+')';
  document.getElementById('submitPreview').classList.add('show');
  dropdown.classList.remove('show');
  subSearch.value=name;
  document.getElementById('submitStatus').textContent='now enter a price and confirm below';
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.searchWrap')) dropdown.classList.remove('show');
});

document.getElementById('cancelAddPubBtn').onclick=resetSubmitForm;

document.getElementById('confirmAddPubBtn').onclick=function(){
  if(!pendingPub) return;

  var statusEl=document.getElementById('submitStatus');
  var price=parseFloat(document.getElementById('subPrice').value);
  var beer=document.getElementById('subBeer').value.trim()||'Unlisted';

  if(isNaN(price) || price<=0 || price>=30){
    statusEl.textContent='enter a valid price before confirming';
    return;
  }

  pendingPub.price=price;
  pendingPub.beer=beer;
  pubs.push(pendingPub);

  statusEl.innerHTML='<span style="color:#4fae63">✅ '+pendingPub.name+' added to the map!</span>';

  drawPins();
  map.panTo([pendingPub.lat,pendingPub.lng]);
  renderCrawlChips();

  subSearch.value='';
  document.getElementById('subPrice').value='';
  document.getElementById('subBeer').value='';
  document.getElementById('submitPreview').classList.remove('show');

  pendingPub=null;
};
</script>
</body>
</html>
